<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具面板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{padding:20px 15px;background:radial-gradient(ellipse at top, #0d1a2e 0%, #050810 100%);color:#a0e0ff;font-family:'Segoe UI','Microsoft YaHei',sans-serif;min-height:100vh;}
.title{font-size:24px;text-align:center;color:#00d4ff;letter-spacing:6px;margin-bottom:5px;text-shadow:0 0 15px rgba(0,212,255,0.8);}
.subtitle{text-align:center;color:#ff6b00;font-size:10px;letter-spacing:5px;margin-bottom:25px;}
.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tab{flex:1;padding:12px;text-align:center;border:1px solid rgba(0,212,255,0.3);border-radius:4px;color:#00d4ff;cursor:pointer;letter-spacing:3px;text-transform:uppercase;font-size:13px;transition:0.3s;}
.tab.active{background:rgba(0,212,255,0.2);box-shadow:0 0 15px rgba(0,212,255,0.4);}
.tab.danger{color:#ff3b3b;border-color:rgba(255,59,59,0.4);}
.tab.danger.active{background:rgba(255,59,59,0.2);box-shadow:0 0 15px rgba(255,59,59,0.4);}
.panel{display:none;background:rgba(5,15,30,0.7);border:1px solid rgba(0,212,255,0.25);border-radius:8px;padding:20px;}
.panel.active{display:block;}
.panel.danger{border-color:rgba(255,59,59,0.3);background:rgba(30,5,5,0.7);}
.row{margin-bottom:15px}
.row label{display:block;font-size:12px;color:#00d4ff;letter-spacing:2px;margin-bottom:6px;text-transform:uppercase;}
.panel.danger .row label{color:#ff6b6b;}
.row input{width:100%;padding:12px;font-size:15px;border-radius:4px;border:1px solid rgba(0,212,255,0.3);background:rgba(0,0,0,0.6);color:#a0e0ff;outline:none;font-family:inherit;}
.row input:focus{border-color:#ff6b00;box-shadow:0 0 12px rgba(255,107,0,0.5)}
.panel.danger .row input{border-color:rgba(255,59,59,0.4);color:#ffb0b0;}
.panel.danger .row input:focus{border-color:#ff3b3b;box-shadow:0 0 12px rgba(255,59,59,0.6)}
.btn{width:100%;padding:15px;font-size:15px;border-radius:4px;border:2px solid #ff6b00;background:rgba(255,107,0,0.1);color:#ff6b00;letter-spacing:4px;cursor:pointer;text-transform:uppercase;font-family:inherit;font-weight:bold;transition:0.3s;}
.btn:hover{background:#ff6b00;color:#050810;box-shadow:0 0 25px #ff6b00}
.btn.del{border-color:#ff3b3b;color:#ff3b3b;background:rgba(255,59,59,0.1);}
.btn.del:hover{background:#ff3b3b;color:#100505;box-shadow:0 0 25px #ff3b3b}
.warn{background:rgba(255,59,59,0.1);border-left:3px solid #ff3b3b;padding:12px;border-radius:4px;font-size:13px;color:#ff6b6b;margin-bottom:15px;line-height:1.6;}
.result{margin-top:15px;padding:15px;background:rgba(0,20,40,0.6);border-left:3px solid #00ff88;border-radius:4px;word-break:break-all;font-size:13px;color:#00ff88;display:none;}
.result.show{display:block}
.result.err{border-left-color:#ff3b3b;color:#ff6b6b;background:rgba(30,0,0,0.6);}
</style>
</head>
<body>
<div class="title">工具面板</div>
<div class="subtitle">Link & Delete</div>

<div class="tabs">
    <div class="tab active" onclick="切换(0)">🔗 生成链接</div>
    <div class="tab danger" onclick="切换(1)">🗑 删除数据</div>
</div>

<!-- 生成链接 -->
<div class="panel active" id="panel0">
    <div class="row"><label>标识（英文/数字）</label><input type="text" id="标识" placeholder="例如 abcd"></div>
    <div class="row"><label>口令</label><input type="text" id="口令" placeholder="例如 1250"></div>
    <button class="btn" onclick="生成链接()">生成链接</button>
    <div id="链接区" style="display:none; margin-top:15px;">
        <div style="font-size:12px;color:#00d4ff;letter-spacing:2px;margin-bottom:6px;">🔗 链接</div>
        <div style="display:flex;gap:8px;">
            <input type="text" id="链接文本" readonly style="flex:1;padding:12px;font-size:13px;border-radius:4px;border:1px solid rgba(0,212,255,0.3);background:rgba(0,0,0,0.6);color:#00ff88;outline:none;font-family:inherit;">
            <button onclick="复制链接()" style="padding:0 20px;border:2px solid #00ff88;background:rgba(0,255,136,0.1);color:#00ff88;border-radius:4px;cursor:pointer;font-weight:bold;font-size:14px;">📋</button>
        </div>
    </div>
    <div class="result" id="结果1"></div>
</div>

<!-- 删除数据 -->
<div class="panel danger" id="panel1">
    <div class="row"><label>标识（要删除的设备）</label><input type="text" id="删除标识" placeholder="例如 abcd"></div>
    <div class="row"><label>GitHub Token</label><input type="password" id="token" placeholder="ghp_xxxxx"></div>
    <div class="warn">
        ⚠️ 危险操作：会**永久删除** GitHub 仓库里的 <code>wuzi_标识.json</code> 文件。<br>
        删完后网页会显示「没有数据」。
    </div>
    <button class="btn del" onclick="删除数据()">🗑 确认删除</button>
    <div class="result" id="结果2"></div>
</div>

<script>
var GITHUB_USER = 'yerennb6';
var GITHUB_REPO = 'wuzi-data';

function 切换(index){
    var tabs = document.querySelectorAll('.tab');
    var panels = document.querySelectorAll('.panel');
    for(var i=0; i<tabs.length; i++){
        tabs[i].classList.remove('active');
        panels[i].classList.remove('active');
    }
    tabs[index].classList.add('active');
    panels[index].classList.add('active');
}

function 生成链接(){
    var 标识 = document.getElementById('标识').value.trim();
    var 口令 = document.getElementById('口令').value.trim();
    if(!标识 || !口令){ alert('标识和口令不能为空'); return; }
    var 基础 = 'https://yerennb6.github.io/wuzi-data/物资统计.html';
    var 链接 = 基础 + '?标识=' + encodeURIComponent(标识) + '&口令=' + encodeURIComponent(口令);
    
    document.getElementById('链接文本').value = 链接;
    document.getElementById('链接区').style.display = 'block';
    复制链接();
}

function 复制链接(){
    var 文本 = document.getElementById('链接文本');
    if(!文本.value) return;
    文本.select();
    文本.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        alert('✅ 链接已复制');
    } catch(e) {
        alert('复制失败，请手动复制');
    }
}

function 删除数据(){
    var 标识 = document.getElementById('删除标识').value.trim();
    var token = document.getElementById('token').value.trim();
    if(!标识){ alert('请填写标识'); return; }
    if(!token){ alert('请填写 GitHub Token'); return; }
    if(!confirm('确定要删除 wuzi_' + 标识 + '.json 吗？\n\n此操作不可撤销！')) return;
    
    var 文件 = 'wuzi_' + 标识 + '.json';
    var 接口 = '/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + 文件;
    var 结果 = document.getElementById('结果2');
    
    fetch('https://api.github.com' + 接口, {
        headers: {
            'Authorization': 'token ' + token,
            'Accept': 'application/vnd.github.v3+json'
        }
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
        if(!res.sha){
            结果.textContent = '❌ 文件不存在，或 Token 没有权限';
            结果.classList.add('show', 'err');
            return;
        }
        return fetch('https://api.github.com' + 接口, {
            method: 'DELETE',
            headers: {
                'Authorization': 'token ' + token,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: 'delete ' + 文件, sha: res.sha })
        });
    })
    .then(function(r){ if(r) return r.json(); })
    .then(function(res2){
        if(!res2) return;
        if(res2.commit){
            结果.textContent = '✅ 已删除 ' + 文件;
            结果.classList.remove('err');
            结果.classList.add('show');
            alert('✅ 已删除 ' + 文件);
        } else {
            结果.textContent = '❌ 删除失败：' + JSON.stringify(res2);
            结果.classList.add('show', 'err');
        }
    })
    .catch(function(e){
        结果.textContent = '❌ 出错了：' + e.message;
        结果.classList.add('show', 'err');
    });
}
</script>
</body>
</html>
