<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物资统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    padding:20px 15px;
    background:radial-gradient(ellipse at top, #0d1a2e 0%, #050810 100%);
    color:#a0e0ff;
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
    min-height:100vh;
    position:relative;
}
body::before{
    content:'';
    position:fixed;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent 0%,#00d4ff 20%,#ff6b00 50%,#00d4ff 80%,transparent 100%);
    box-shadow:0 0 20px #00d4ff,0 0 40px rgba(255,107,0,0.5);
    animation:flow 3s linear infinite;background-size:200% 100%;z-index:10;
}
@keyframes flow{0%{background-position:200% 0}100%{background-position:-200% 0}}
body::after{
    content:'';position:fixed;top:10px;left:10px;right:10px;bottom:10px;
    border:1px solid rgba(0,212,255,0.15);border-radius:3px;
    pointer-events:none;z-index:1;
}
.title{
    font-size:26px;text-align:center;color:#00d4ff;
    letter-spacing:6px;font-weight:300;
    text-shadow:0 0 15px rgba(0,212,255,0.8);
    margin-bottom:4px;position:relative;z-index:2;text-transform:uppercase;
}
.subtitle{
    text-align:center;color:#ff6b00;font-size:10px;
    letter-spacing:5px;margin-bottom:25px;text-transform:uppercase;
    position:relative;z-index:2;text-shadow:0 0 8px rgba(255,107,0,0.6);
}
.subtitle::before{content:'▬▬ '}
.subtitle::after{content:' ▬▬'}
.setting{
    display:flex;gap:8px;justify-content:center;
    margin-bottom:15px;flex-wrap:wrap;position:relative;z-index:2;
}
.setting input{
    width:90px;padding:10px;font-size:14px;border-radius:3px;
    border:1px solid rgba(0,212,255,0.4);
    background:rgba(5,15,30,0.9);color:#00d4ff;
    text-align:center;outline:none;transition:0.3s;font-family:inherit;
}
.setting input:focus{
    border-color:#ff6b00;box-shadow:0 0 15px rgba(255,107,0,0.5);color:#ff6b00;
}
.setting button{
    padding:10px 22px;font-size:13px;border-radius:3px;
    border:1px solid #00d4ff;background:rgba(0,212,255,0.1);color:#00d4ff;
    letter-spacing:3px;cursor:pointer;transition:0.3s;
    font-family:inherit;text-transform:uppercase;
}
.setting button:hover{background:#00d4ff;color:#050810;box-shadow:0 0 25px #00d4ff;}
.pwd-box{
    background:rgba(5,15,30,0.7);
    border:1px solid rgba(0,212,255,0.25);
    border-radius:3px;padding:15px;margin-bottom:15px;
    position:relative;z-index:2;
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.pwd-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pwd-row input{
    flex:1;padding:10px;font-size:14px;border-radius:3px;
    border:1px solid rgba(0,212,255,0.3);
    background:rgba(0,0,0,0.6);color:#a0e0ff;
    outline:none;font-family:inherit;transition:0.3s;
}
.pwd-row input.id-input{
    max-width:80px;text-align:center;color:#ff6b00;
    border-color:rgba(255,107,0,0.4);
}
.pwd-row input:focus{border-color:#00d4ff;box-shadow:0 0 12px rgba(0,212,255,0.5);}
.pwd-row input.id-input:focus{border-color:#ff6b00;box-shadow:0 0 12px rgba(255,107,0,0.5);}
.query-btn{
    width:100%;padding:14px;font-size:14px;border-radius:3px;
    border:2px solid #ff6b00;background:rgba(255,107,0,0.1);color:#ff6b00;
    letter-spacing:6px;cursor:pointer;margin-bottom:25px;transition:0.3s;
    text-transform:uppercase;font-family:inherit;font-weight:bold;
    position:relative;z-index:2;
}
.query-btn:hover{background:#ff6b00;color:#050810;box-shadow:0 0 30px rgba(255,107,0,0.8);}
.device{
    margin-bottom:25px;padding:18px;
    background:rgba(5,15,30,0.5);
    border:1px solid rgba(0,212,255,0.2);border-radius:3px;
    position:relative;z-index:2;
    clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
}
.device-title{
    font-size:14px;color:#00d4ff;letter-spacing:3px;
    margin-bottom:12px;padding-bottom:8px;
    border-bottom:1px dashed rgba(0,212,255,0.3);
    text-transform:uppercase;display:flex;
    justify-content:space-between;align-items:center;
}
.device-title::before{content:'▣ ';color:#ff6b00}
.device-title::after{content:' ONLINE';color:#00ff88;font-size:10px}
.countdown{
    text-align:center;color:#ff6b00;font-size:12px;
    margin-bottom:12px;letter-spacing:3px;padding:6px;
    background:rgba(255,107,0,0.08);
    border-left:2px solid #ff6b00;border-right:2px solid #ff6b00;
}
.off{text-align:center;color:#3a4a5a;font-size:13px;padding:30px;letter-spacing:4px;}
.item{
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(0,20,40,0.6);border-radius:3px;
    padding:12px 15px;margin-bottom:6px;
    border-left:3px solid #00d4ff;transition:0.3s;
    position:relative;overflow:hidden;
}
.item::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(0,212,255,0.1), transparent);
    transition:0.5s;
}
.item:hover::before{left:100%}
.item:hover{border-left-color:#ff6b00;background:rgba(0,30,60,0.8);}
.item .left{
    display:flex;align-items:center;font-size:14px;
    letter-spacing:2px;text-transform:uppercase;
}
.item .icon{font-size:20px;margin-right:12px;}
.item .count{
    font-size:20px;font-weight:bold;color:#00d4ff;
    letter-spacing:2px;text-shadow:0 0 10px rgba(0,212,255,0.8);
    font-variant-numeric:tabular-nums;
}
.status{
    text-align:center;color:#3a4a5a;font-size:10px;
    margin-top:20px;letter-spacing:3px;
    position:relative;z-index:2;text-transform:uppercase;
}
.status::before{content:'● ';color:#00ff88;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:0.3}}
</style>
</head>
<body>
<div class="title">物资统计</div>
<div class="subtitle">Combat Data Terminal</div>

<div class="setting">
    <input type="number" id="设备数" value="1" min="1" max="10" placeholder="设备数">
    <button onclick="生成口令框()">连接</button>
</div>

<div id="pwdArea"></div>
<div id="content"></div>
<div class="status" id="status"></div>

<script>
var GITHUB_USER = 'yerennb6';
var GITHUB_REPO = 'wuzi-data';

var 物资配置 = [
    {key: '木头',  icon: '🪵', color: '#8B4513'},
    {key: '石头',  icon: '🪨', color: '#9e9b84'},
    {key: '铁',    icon: '⛏️', color: '#787569'},
    {key: '硫磺',  icon: '💎', color: '#a9991d'},
    {key: '精铁',  icon: '🔩', color: '#44472d'},
    {key: '布',    icon: '🧵', color: '#baa374'},
    {key: '油',    icon: '🛢️', color: '#882a14'},
    {key: '原油',  icon: '⛽', color: '#b45d37'}
];

var 当前设备数 = 1;
var 设备数据缓存 = {};

function 生成口令框(){
    当前设备数 = parseInt(document.getElementById('设备数').value) || 1;
    if(当前设备数 < 1) 当前设备数 = 1;
    if(当前设备数 > 10) 当前设备数 = 10;
    localStorage.setItem('设备数', 当前设备数);
    
    var html = '<div class="pwd-box">';
    for(var i=0; i<当前设备数; i++){
        var 保存标识 = localStorage.getItem('标识_' + i) || '';
        var 保存口令 = localStorage.getItem('口令_' + i) || '';
        html += '<div class="pwd-row">';
        html += '<input type="text" class="id-input" id="标识_' + i + '" placeholder="ID" value="' + 保存标识 + '">';
        html += '<input type="text" id="口令_' + i + '" placeholder="密码" value="' + 保存口令 + '">';
        html += '</div>';
    }
    html += '</div>';
    html += '<button class="query-btn" onclick="查询()">查询</button>';
    document.getElementById('pwdArea').innerHTML = html;
    document.getElementById('content').innerHTML = '';
    document.getElementById('status').textContent = '';
}

function 查询(){
    var 完成数 = 0;
    var 结果数组 = new Array(当前设备数);
    
    for(var i=0; i<当前设备数; i++){
        (function(index){
            var 标识 = document.getElementById('标识_' + index).value.trim();
            var 口令 = document.getElementById('口令_' + index).value.trim();
            localStorage.setItem('标识_' + index, 标识);
            localStorage.setItem('口令_' + index, 口令);
            
            if(!标识 || !口令){
                结果数组[index] = '<div class="device"><div class="device-title">未填写</div><div class="off">[ 标识或口令为空 ]</div></div>';
                完成数++;
                if(完成数 === 当前设备数) 显示结果(结果数组);
                return;
            }
            
            读设备(标识, 口令, function(data){
                设备数据缓存[index] = { 标识: 标识, 口令: 口令, data: data };
                结果数组[index] = 渲染设备(标识, data, 口令);
                完成数++;
                if(完成数 === 当前设备数){
                    显示结果(结果数组);
                    启动倒计时();
                }
            });
        })(i);
    }
}

function 显示结果(结果数组){
    document.getElementById('content').innerHTML = 结果数组.join('');
    document.getElementById('status').textContent = '更新于 ' + new Date().toLocaleString();
}

function 读设备(标识, 输入口令, callback){
    var url = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/wuzi_' + 标识 + '.json?t=' + Date.now();
    fetch(url)
        .then(function(r){
            if(!r.ok) throw new Error('not found');
            return r.json();
        })
        .then(function(data){ callback(data); })
        .catch(function(){ callback(null); });
}

function 渲染设备(标识, data, 输入口令){
    var html = '<div class="device" id="device_' + 标识 + '">';
    html += '<div class="device-title">' + 标识 + '</div>';
    
    if(!data){
        html += '<div class="off">[ 无数据 ]</div>';
    } else if(String(data.口令) !== String(输入口令)){
        html += '<div class="off">[ 口令不匹配 ]</div>';
    } else if(!data.开启){
        html += '<div class="off">[ 未开启 ]</div>';
    } else if(!data.心跳时间 || !data.有效期小时){
        html += '<div class="off">[ 数据格式过旧 ]</div>';
    } else {
        html += 渲染内容(标识, data);
    }
    html += '</div>';
    return html;
}

function 渲染内容(标识, data){
    var 过期时刻 = data.心跳时间 + data.有效期小时 * 3600 * 1000;
    var 剩余毫秒 = 过期时刻 - Date.now();
    var html = '';
    
    if(剩余毫秒 <= 0){
        html += '<div class="off">[ 数据已过期 ]</div>';
        return html;
    }
    
    var 剩余秒 = Math.floor(剩余毫秒 / 1000);
    var 时 = Math.floor(剩余秒 / 3600);
    var 分 = Math.floor((剩余秒 % 3600) / 60);
    var 秒 = 剩余秒 % 60;
    html += '<div class="countdown">⏱ 剩余 ' + 时 + '时' + 分 + '分' + 秒 + '秒</div>';
    
    for(var i=0; i<物资配置.length; i++){
        var cfg = 物资配置[i];
        var count = data[cfg.key] || 0;
        html += '<div class="item" style="border-left-color:' + cfg.color + '">';
        html += '<span class="left"><span class="icon">' + cfg.icon + '</span>';
        html += '<span style="color:' + cfg.color + '">' + cfg.key + '</span></span>';
        html += '<span class="count">' + count + '</span></div>';
    }
    return html;
}

function 启动倒计时(){
    if(window._timer) clearInterval(window._timer);
    window._timer = setInterval(function(){
        for(var key in 设备数据缓存){
            var 缓存 = 设备数据缓存[key];
            if(!缓存 || !缓存.data || !缓存.data.心跳时间) continue;
            var el = document.getElementById('device_' + 缓存.标识);
            if(!el) continue;
            var 剩余毫秒 = 缓存.data.心跳时间 + 缓存.data.有效期小时 * 3600 * 1000 - Date.now();
            var 旧 = el.querySelector('.countdown');
            if(剩余毫秒 <= 0){
                el.innerHTML = '<div class="device-title">' + 缓存.标识 + '</div><div class="off">[ 数据已过期 ]</div>';
            } else if(旧){
                var 剩余秒 = Math.floor(剩余毫秒 / 1000);
                var 时 = Math.floor(剩余秒 / 3600);
                var 分 = Math.floor((剩余秒 % 3600) / 60);
                var 秒 = 剩余秒 % 60;
                旧.textContent = '⏱ 剩余 ' + 时 + '时' + 分 + '分' + 秒 + '秒';
            }
        }
    }, 1000);
}

// 启动
var 保存设备数 = localStorage.getItem('设备数') || 1;
document.getElementById('设备数').value = 保存设备数;
当前设备数 = parseInt(保存设备数);
生成口令框();

// 从网址参数自动填入并查询
var 网址参数 = new URLSearchParams(location.search);
var 网址标识 = 网址参数.get('标识');
var 网址口令 = 网址参数.get('口令');
if(网址标识 && 网址口令){
    setTimeout(function(){
        document.getElementById('标识_0').value = 网址标识;
        document.getElementById('口令_0').value = 网址口令;
        查询();
    }, 200);
}
</script>
</body>
</html>
